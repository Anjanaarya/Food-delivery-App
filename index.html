<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bite — Food delivery</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ef;--card:#fff;--ink:#1c1b1a;--mute:#76706a;--line:#e8e2db;--brand:#fc6a0b;--brand-ink:#fff;--ok:#1a8a4a;--bad:#d62839;--warn:#b86e00;--warnbg:#fff1d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#23201d;--ink:#f3eee8;--mute:#a39b92;--line:#38332e;--warnbg:#3a2c10;--warn:#ffc15a;--ok:#4cc57e;--bad:#ff6b78}}
:root[data-theme="dark"]{--bg:#171513;--card:#23201d;--ink:#f3eee8;--mute:#a39b92;--line:#38332e;--warnbg:#3a2c10;--warn:#ffc15a;--ok:#4cc57e;--bad:#ff6b78}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);color:var(--ink);border-bottom:1px solid var(--line);z-index:5;padding:10px clamp(16px,4vw,56px)}
.bar{max-width:none;margin:0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-weight:800;font-size:26px;letter-spacing:-1px;color:var(--brand)}
.tabs{display:flex;background:var(--bg);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;color:inherit;font:inherit;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer}
.tabs button.on{background:var(--brand);color:#fff}
main{max-width:none;margin:0;padding:16px clamp(16px,4vw,56px)}.narrow{max-width:860px;margin:0 auto}
h2{font-size:20px;margin:6px 0 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer;text-align:left}
.chip.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.chip small{display:block;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.mute{color:var(--mute);font-size:14px}
.btn{border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:none;border:1px solid var(--bad);color:var(--bad)}
.btn.alt{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.ok{background:var(--ok);color:#fff}
.btn.full{width:100%;padding:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible{outline:3px solid #1a6cff;outline-offset:2px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--brand);background:none;color:var(--brand);font-weight:800;font-size:18px;cursor:pointer}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:13px;font-weight:700;background:var(--line)}
.tag.placed{background:var(--warnbg);color:var(--warn)}.tag.accepted,.tag.preparing,.tag.ready,.tag.picked{background:#dbeaff;color:#1a56b8}
.tag.delivered{background:#d6f3e1;color:#14733c}.tag.cancelled{background:#fde0e3;color:var(--bad)}
@media (prefers-color-scheme:dark){.tag.accepted,.tag.preparing,.tag.ready,.tag.picked{background:#1d2f4d;color:#8bb6ff}.tag.delivered{background:#17382a;color:#4cc57e}.tag.cancelled{background:#43191e}}
.late{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 12px;font-weight:700;margin-top:8px}
.track{display:flex;gap:4px;margin:10px 0 4px}.track i{flex:1;height:5px;border-radius:3px;background:var(--line)}.track i.d{background:var(--ok)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.cartbar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));}
footer{margin:0 0 24px;padding:0 clamp(16px,4vw,56px)}
.sim{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px dashed var(--line);border-radius:12px;padding:10px 14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:9}

.where{font-weight:800;margin:2px 0 10px}.where span{color:var(--mute);font-weight:600}
.search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:13px 16px;font:inherit;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.banner{border-radius:18px;padding:20px;color:#fff;background:linear-gradient(120deg,#fc6a0b,#ff3d4f);display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;overflow:hidden}
.banner b{font-size:26px;line-height:1.1;display:block;letter-spacing:-.5px}.banner span{font-size:14px;opacity:.95}.banner em{font-size:64px;font-style:normal}
.cats{display:flex;gap:16px;overflow-x:auto;padding:4px 2px 12px}
.cat{flex:none;background:none;border:0;font:inherit;color:var(--ink);text-align:center;cursor:pointer;width:74px;font-weight:600;font-size:13px}
.cat i{display:grid;place-items:center;width:68px;height:68px;border-radius:50%;background:var(--card);border:2px solid var(--line);font-size:34px;font-style:normal;margin-bottom:4px}
.cat.on i{border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;margin-bottom:12px}
.rc{background:none;border:0;padding:0;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.img{position:relative;height:160px;border-radius:18px;display:grid;place-items:center;font-size:76px;overflow:hidden}
.img .off{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 8px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;font-weight:800;font-size:18px;letter-spacing:-.3px}
.rc b{font-size:18px;display:block;margin-top:8px}
.rate{display:inline-flex;align-items:center;gap:3px;background:#24963f;color:#fff;border-radius:6px;padding:1px 7px;font-size:13px;font-weight:800}
.dot{display:inline-grid;place-items:center;width:16px;height:16px;border:2px solid;border-radius:3px;flex:none}.dot:after{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.dot.v{color:#24963f}.dot.n{color:#c8321f}
.back{border:0;background:none;color:var(--ink);font:inherit;font-weight:800;font-size:15px;cursor:pointer;padding:4px 0 10px}
.mh{padding:4px 0 14px;border-bottom:1px dashed var(--line);margin-bottom:6px}.mh h2{margin:0 0 4px;font-size:26px;letter-spacing:-.5px}
.mi{display:flex;justify-content:space-between;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}.mi:last-child{border:0}
.mi b{font-size:17px;display:block;margin:4px 0 2px}
.pic{position:relative;flex:none;width:118px;height:104px;border-radius:14px;background:var(--line);display:grid;place-items:center;font-size:52px}
.add{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);width:92px;height:36px;background:var(--card);color:var(--ok);border:1px solid var(--line);border-radius:10px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:space-around}
.add button{border:0;background:none;color:inherit;font:inherit;font-weight:800;font-size:18px;cursor:pointer;padding:0 6px}
.cartbar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));margin-top:14px}
.cb{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-radius:14px;background:#24963f;color:#fff;padding:14px 18px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25)}

.where{background:none;border:0;color:var(--ink);font:inherit;font-weight:800;cursor:pointer;display:block;text-align:left;padding:0;margin:2px 0 12px;max-width:100%}
.where small{display:block;font-weight:400;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.addr{display:flex;gap:12px;flex:1;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;align-items:flex-start;text-align:left;background:none;color:var(--ink);font:inherit}.addr.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:13px;color:var(--mute)}.stats b{display:block;font-size:22px;color:var(--ink)}

.og{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}.og>h2,.og>.empty{grid-column:1/-1}.og .card{margin:0}
.vid{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:32/27}

.mid{text-align:center;margin:6px 0 24px}.mid h2{margin-bottom:4px}.mid p{margin:0 0 12px}
.clips{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.clip{width:220px;border-radius:14px;overflow:hidden;background:linear-gradient(160deg,#2b2118,#5a3b22);color:#fff;text-align:left;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.new{display:inline-block;margin-left:8px;vertical-align:middle;background:#fc6a0b;color:#fff;border-radius:5px;padding:1px 7px;font-size:11px;font-weight:800;letter-spacing:.3px}
.clip.vid{background:#000}.clip video{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
</style>
</head>

{n:"Kebab Junction",img:"kebab",c:"Kebabs, Mughlai, Indian",e:"🍢",g:"#ffb199,#c0392b",r:4.2,t:"30-40",o:"FLAT 15% OFF",m:[["Chicken seekh kebab",249,0,"🍢",0,"kebab"],["Malai chicken tikka",279,0,"🍗"],["Paneer shashlik",249,1,"🧀"],["Afghani chicken",299,0,"🍗"],["Mutton galouti kebab",349,0,"🍖"],["Hara bhara kebab",199,1,"🥬"],["Tandoori roti",25,1,"🫓"],["Butter naan",60,1,"🫓"],["Lachha paratha",70,1,"🫓"],["Mint chutney",20,1,"🌿"]]}];
const IMG={samosa2:"data:image/...;base64,...IMAGE_DATA...",tandoori:"data:image/...;base64,...IMAGE_DATA...",kebab:"data:image/...;base64,...IMAGE_DATA...",coffee:"data:image/...;base64,...IMAGE_DATA...",salad:"data:image/...;base64,...IMAGE_DATA...",momos:"data:image/...;base64,...IMAGE_DATA...",biryani:"data:image/...;base64,...IMAGE_DATA...",dosa:"data:image/...;base64,...IMAGE_DATA...",pastry:"data:image/...;base64,...IMAGE_DATA...",noodles:"data:image/...;base64,...IMAGE_DATA...",thali:"data:image/...;base64,...IMAGE_DATA...",pizza:"data:image/...;base64,...IMAGE_DATA...",wrap:"data:image/...;base64,...IMAGE_DATA...",samosa:"data:image/...;base64,...IMAGE_DATA...",tenders:"data:image/...;base64,...IMAGE_DATA...",burgers:"data:image/...;base64,...IMAGE_DATA...",dabeli:"data:image/...;base64,...IMAGE_DATA...",mix:"data:image/...;base64,...IMAGE_DATA..."};
(()=>{let c=".ph{background-size:cover;background-position:center}.banner.hasimg{min-height:170px;background-image:linear-gradient(100deg,rgba(214,64,8,.93) 35%,rgba(255,61,79,.25)),url("+IMG.mix+");background-size:cover;background-position:center}";for(const k in IMG)c+=".ph-"+k+"{background-image:url("+IMG[k]+")}";const st=document.createElement("style");st.textContent=c;document.head.appendChild(st)})();
const CATS=[["🍽️","All",""],["🍕","Pizza","Pizza"],["🍛","Indian","Indian"],["🥞","South","South"],["🍔","Burgers","Burger"],["🍜","Chinese","Chinese"],["🍰","Desserts","Dessert"],["🍚","Biryani","Biryani"],["🌯","Rolls","Rolls"],["🥗","Healthy","Healthy"],["🥟","Momos","Momo"],["☕","Cafe","Cafe"]];
const STEPS=["placed","accepted","preparing","ready","picked","delivered"];
const LABEL={placed:"Placed",accepted:"Accepted",preparing:"Preparing",ready:"Ready for pickup",picked:"Out for delivery",delivered:"Delivered",cancelled:"Cancelled"};
const S={view:"c",clock:0,rid:null,cx:null,q:"",cat:"",addrs:[{l:"Home",t:"Flat 12, Green Park Apartments, Block B"}],ai:0,showAddr:false,dl:"Home",dt:"",cart:{},orders:[],next:101,restRid:0,toast:""};
const rup=n=>"₹"+n;
const ACTIVE=o=>o.status!="delivered"&&o.status!="cancelled";
function late(o){return ACTIVE(o)?Math.max(0,S.clock-(o.t0+o.eta+o.delay)):0}
function openAddr(){S.showAddr=true;render()}
function pickAddr(i){S.ai=i;S.showAddr=false;render()}
function saveAddr(){if(!S.dt.trim()){say("Enter your full address");return}S.addrs.push({l:S.dl,t:S.dt.trim()});S.ai=S.addrs.length-1;S.dt="";S.showAddr=false;say("Address saved")}
function delAddr(i){if(S.addrs.length<2){say("Keep at least one address");return}S.addrs.splice(i,1);S.ai=Math.min(S.ai,S.addrs.length-1);render()}
function addrSheet(){return `<div class="ov" onclick="if(event.target==this){S.showAddr=false;render()}"><div class="sheet" role="dialog" aria-label="Choose delivery address">
 <div class="row"><h2 style="margin:0">Select delivery address</h2><button class="back" style="padding:0" onclick="S.showAddr=false;render()">Close</button></div>
 <div style="margin-top:12px">${S.addrs.map((a,i)=>`<div class="row" style="gap:6px;margin-bottom:8px"><button class="addr ${i==S.ai?"on":""}" onclick="pickAddr(${i})"><span>${a.l=="Work"?"🏢":a.l=="Home"?"🏠":"📍"}</span><span><b>${a.l}</b><div class="mute">${a.t}</div></span></button><button class="btn alt" aria-label="Delete ${a.l} address" onclick="delAddr(${i})">✕</button></div>`).join("")}</div>
 <h2 style="font-size:17px;margin-top:16px">Add a new address</h2>
 <div class="actions" style="margin:0 0 10px">${["Home","Work","Other"].map(l=>`<button class="chip ${S.dl==l?"on":""}" onclick="S.dl='${l}';render()">${l}</button>`).join("")}</div>
 <input id="at" class="search" style="margin-bottom:10px" placeholder="House no., building, street, area" value="${S.dt.replace(/"/g,"&quot;")}" oninput="S.dt=this.value">
 <button class="btn full" onclick="saveAddr()">Save and deliver here</button></div></div>`}
function cancelR(id,why){const o=S.orders.find(x=>x.id==id);o.cr=why;S.cx=null;setStatus(id,'cancelled','restaurant')}
function say(t){S.toast=t;render();setTimeout(()=>{S.toast="";render()},1800)}
function adv(m){S.clock+=m;render()}
setInterval(()=>{S.clock++;render()},4000);

function addQ(i,d){const k=S.rid+":"+i;S.cart[k]=Math.max(0,(S.cart[k]||0)+d);if(!S.cart[k])delete S.cart[k];render()}
function pickR(i){if(i!==S.rid)S.cart={};S.rid=i;window.scrollTo(0,0);render()}
function place(){
 const items=Object.entries(S.cart).map(([k,q])=>{const m=R[S.rid].m[+k.split(":")[1]];return{n:m[0],p:m[1],q}});
 if(!items.length)return;
 S.orders.unshift({id:S.next++,rid:S.rid,addr:S.addrs[S.ai].l+" · "+S.addrs[S.ai].t,items,total:items.reduce((a,x)=>a+x.p*x.q,0)+30,status:"placed",t0:S.clock,eta:35,delay:0,reason:"",by:""});
 S.cart={};S.rid=null;say("Order placed")}
function setStatus(id,st,by){const o=S.orders.find(x=>x.id==id);o.status=st;if(by)o.by=by;
 if(st=="cancelled")say("Order cancelled");else say(LABEL[st]);}
function report(id,min,why){const o=S.orders.find(x=>x.id==id);o.delay+=min;o.reason=why;say("Delay of "+min+" min reported to customer")}

function track(o){if(o.status=="cancelled")return"";const at=STEPS.indexOf(o.status);
 return `<div class="track">${STEPS.map((s,i)=>`<i class="${i<=at?"d":""}"></i>`).join("")}</div>`}
function etaBlock(o){if(!ACTIVE(o))return"";const left=o.t0+o.eta+o.delay-S.clock,l=late(o);
 let h=l>0?`<div class="late">Running ${l} min late${o.reason?" — "+o.reason:""}</div>`
  :`<div class="mute">Arriving in ~${Math.max(left,1)} min${o.delay?` (delayed by ${o.delay} min${o.reason?": "+o.reason:""})`:""}</div>`;
 if(l>0&&!o.reason)h=`<div class="late">Running ${l} min late</div>`;return h}
function itemsTxt(o){return o.items.map(x=>x.q+" × "+x.n).join(", ")}

function ordersHtml(){let h=`<h2 style="margin-top:20px">Your orders</h2>`;
 if(!S.orders.length)h+=`<div class="empty">No orders yet. Pick a restaurant and add something.</div>`;
 S.orders.forEach(o=>{const can=o.status=="placed"||o.status=="accepted";
  h+=`<div class="card"><div class="row"><b>#${o.id} · ${R[o.rid].n}</b><span class="tag ${o.status}">${LABEL[o.status]}</span></div>
  <div class="mute">${itemsTxt(o)} · ${rup(o.total)}</div><div class="mute">📍 ${o.addr}</div>${track(o)}${etaBlock(o)}
  ${o.status=="cancelled"?`<div class="mute">${o.by=="restaurant"?"The restaurant cancelled this order"+(o.cr?": "+o.cr:"")+". You won't be charged.":"You cancelled this order."}</div>`:""}
  ${ACTIVE(o)?`<div class="actions"><button class="btn ghost" ${can?"":"disabled"} onclick="setStatus(${o.id},'cancelled','customer')">Cancel order</button>${can?"":`<span class="mute" style="align-self:center">Can't cancel once cooking starts</span>`}</div>`:""}</div>`});
 return h}
function customer(){
 if(S.rid===null){
  const list=R.map((x,i)=>[x,i]).filter(([x])=>(!S.cat||x.c.includes(S.cat))&&(!S.q||(x.n+x.c+x.m.map(m=>m[0]).join()).toLowerCase().includes(S.q.toLowerCase())));
  return `<button class="where" onclick="openAddr()">${S.addrs[S.ai].l} ▾<small>${S.addrs[S.ai].t}</small></button>
  <input id="q" class="search" placeholder="Search for restaurants and dishes" value="${S.q.replace(/"/g,"&quot;")}" oninput="S.q=this.value;render()">
  <div class="banner hasimg"><div><b>Up to 60% OFF</b><span>on your first order · use BITE60</span></div></div>
  <h2>What's on your mind?</h2><div class="cats">${CATS.map(c=>`<button class="cat ${S.cat==c[2]?"on":""}" onclick="S.cat='${c[2]}';render()"><i>${c[0]}</i>${c[1]}</button>`).join("")}</div>
  <!--MID--><h2>${list.length} restaurants to explore</h2>
  ${list.length?`<div class="grid">${list.map(([x,i])=>`<button class="rc" onclick="pickR(${i})"><div class="img ${x.img?"ph ph-"+x.img:""}" style="${x.img?"":`background:linear-gradient(135deg,${x.g})`}">${x.img?"":x.e}<div class="off">${x.o}</div></div>
   <b>${x.n}</b><div><span class="rate">★ ${x.r}</span> <b style="display:inline;font-size:15px">· ${x.t} mins</b></div><div class="mute">${x.c}</div></button>`).join("")}</div>`:`<div class="empty">Nothing matches "${S.q}". Try another dish or clear the filter.</div>`}
  <section class="og">${ordersHtml()}</section>`}
 const r=R[S.rid];
 const cnt=Object.values(S.cart).reduce((a,b)=>a+b,0);
 const sub=Object.entries(S.cart).reduce((a,[k,q])=>a+r.m[+k.split(":")[1]][1]*q,0);
 return `<button class="back" onclick="S.rid=null;S.cart={};render()">← All restaurants</button>
 <div class="mh"><div class="row"><h2>${r.n}</h2><span class="rate">★ ${r.r}</span></div><div class="mute">${r.c}</div><b>${r.t} mins</b> <span class="mute">· ₹30 delivery fee · ${r.o}</span></div>
 ${r.m.map((m,i)=>{const q=S.cart[S.rid+":"+i]||0;return `<div class="mi"><div><span class="dot ${m[2]?"v":"n"}" aria-label="${m[2]?"Veg":"Non-veg"}"></span><b>${m[0]}${m[4]?`<span class="new">NEW</span>`:""}</b><div>${rup(m[1])}</div></div>
 <div class="pic ${m[5]?"ph ph-"+m[5]:""}">${m[5]?"":m[3]}${q?`<div class="add"><button aria-label="Remove one" onclick="addQ(${i},-1)">−</button>${q}<button aria-label="Add one" onclick="addQ(${i},1)">+</button></div>`:`<button class="add" onclick="addQ(${i},1)">ADD</button>`}</div></div>`}).join("")}
 ${cnt?`<div class="cartbar"><div class="row card" style="padding:8px 14px;margin-bottom:6px"><span class="mute">📍 ${S.addrs[S.ai].l} · ${S.addrs[S.ai].t}</span><button class="back" style="padding:0;color:var(--brand)" onclick="openAddr()">Change</button></div><button class="cb" onclick="place()"><span>${cnt} item${cnt>1?"s":""} · ${rup(sub+30)}</span><span>Place order ›</span></button></div>`:""}`}

function restaurant(){
 const rr=S.restRid,os=S.orders.filter(o=>o.rid==rr);
 const n=k=>os.filter(o=>k.includes(o.status)).length;
 const WHY=["Item out of stock","Kitchen too busy","Restaurant closing soon"];
 let h=`<div class="row"><h2>Restaurant orders</h2><select aria-label="Restaurant" onchange="S.restRid=+this.value;S.cx=null;render()">${R.map((x,i)=>`<option value="${i}" ${i==rr?"selected":""}>${x.n}</option>`).join("")}</select></div>
 <div class="stats"><div><b>${n(["placed"])}</b>New</div><div><b>${n(["accepted","preparing"])}</b>In kitchen</div><div><b>${n(["ready","picked"])}</b>Ready</div><div><b>${n(["delivered"])}</b>Completed</div></div>`;
 if(!os.length)h+=`<div class="empty">No orders for ${R[rr].n} yet. Place one from the Customer tab.</div>`;
 os.forEach(o=>{
  const cancelBtn=`<button class="btn ghost" onclick="S.cx=${o.id};render()">Cancel order</button>`;
  let a="";
  if(o.status=="placed")a=`<button class="btn ok" onclick="setStatus(${o.id},'accepted')">Take order</button>${cancelBtn}`;
  if(o.status=="accepted")a=`<button class="btn" onclick="setStatus(${o.id},'preparing')">Start preparing</button>${cancelBtn}`;
  if(o.status=="preparing")a=`<button class="btn ok" onclick="setStatus(${o.id},'ready')">Mark ready for pickup</button>${cancelBtn}`;
  if(o.status=="ready")a=`<span class="mute">Waiting for a delivery partner</span>`;
  if(o.status=="picked")a=`<span class="mute">Picked up by delivery partner</span>`;
  if(S.cx==o.id)a=`<div style="width:100%"><b>Why are you cancelling?</b><div class="mute">The customer will see this reason.</div><div class="actions">${WHY.map(w=>`<button class="btn ghost" onclick="cancelR(${o.id},'${w}')">${w}</button>`).join("")}<button class="btn alt" onclick="S.cx=null;render()">Keep order</button></div></div>`;
  h+=`<div class="card" ${o.status=="placed"?'style="border:2px solid var(--brand)"':""}><div class="row"><b>#${o.id}${o.status=="placed"?" · New order":""}</b><span class="tag ${o.status}">${LABEL[o.status]}</span></div>
  <div style="margin-top:6px">${o.items.map(x=>`<div>${x.q} × ${x.n}</div>`).join("")}</div>
  <div class="mute">Total ${rup(o.total)} · placed ${S.clock-o.t0} min ago</div>
  ${o.status=="cancelled"?`<div class="mute">${o.by=="customer"?"Cancelled by customer":"Cancelled by you"+(o.cr?": "+o.cr:"")}</div>`:""}
  ${late(o)?`<div class="late">Order is ${late(o)} min late</div>`:""}
  <div class="actions">${a}</div></div>`});
 return h}

function delivery(){
 const avail=S.orders.filter(o=>o.status=="ready"),mine=S.orders.filter(o=>o.status=="picked"),done=S.orders.filter(o=>o.status=="delivered");
 let h=`<h2>Delivery partner</h2><div class="mute" style="margin-bottom:10px">Today: ${done.length} delivered · ${rup(done.length*40)} earned</div>`;
 h+=`<h2 style="font-size:17px">Current delivery</h2>`;
 if(!mine.length)h+=`<div class="empty">No active delivery. Pick up a ready order below.</div>`;
 mine.forEach(o=>{h+=`<div class="card"><div class="row"><b>#${o.id} · ${R[o.rid].n}</b><span class="tag picked">${LABEL[o.status]}</span></div>
  <div class="mute">${itemsTxt(o)}</div><div style="margin-top:4px"><b>Drop to:</b> ${o.addr}</div>${track(o)}${etaBlock(o)}
  <div class="mute" style="margin-top:10px">Report a delay so the customer knows:</div>
  <div class="actions">
   <button class="btn alt" onclick="report(${o.id},5,'Heavy traffic')">+5 min · Traffic</button>
   <button class="btn alt" onclick="report(${o.id},10,'Waiting at restaurant')">+10 min · Restaurant wait</button>
   <button class="btn alt" onclick="report(${o.id},15,'Rain on the route')">+15 min · Rain</button></div>
  <div class="actions"><button class="btn ok full" onclick="setStatus(${o.id},'delivered')">Mark delivered</button></div></div>`});
 h+=`<h2 style="font-size:17px;margin-top:18px">Ready for pickup</h2>`;
 if(!avail.length)h+=`<div class="empty">Nothing waiting. New orders appear when a restaurant marks them ready.</div>`;
 avail.forEach(o=>{h+=`<div class="card"><div class="row"><b>#${o.id} · ${R[o.rid].n}</b><span class="mute">${rup(40)} payout</span></div>
  <div class="mute">${itemsTxt(o)}</div><div style="margin-top:4px"><b>Drop to:</b> ${o.addr}</div>${late(o)?`<div class="late">Already ${late(o)} min late — pick up fast</div>`:""}
  <div class="actions"><button class="btn" onclick="setStatus(${o.id},'picked')">Pick up order</button></div></div>`});
 return h}

function render(){
 const y=window.scrollY;
 document.getElementById("tabs").innerHTML=[["c","Customer"],["r","Restaurant"],["d","Delivery"]].map(t=>`<button role="tab" class="${S.view==t[0]?"on":""}" onclick="S.view='${t[0]}';render()">${t[1]}</button>`).join("");
 const fid=document.activeElement&&["q","at"].includes(document.activeElement.id)?document.activeElement.id:"",hadQ=!!fid,pos=hadQ?document.activeElement.selectionStart:0;
 const html=(S.view=="c"?customer:S.view=="r"?restaurant:delivery)(),ov=(S.showAddr?addrSheet():"")+(S.toast?`<div class="toast" role="status">${S.toast}</div>`:""),parts=html.split("<!--MID-->"),home=parts.length>1;
 document.getElementById("top").innerHTML=home?parts[0]:`<div class="narrow">${parts[0]}</div>`;
 document.getElementById("bot").innerHTML=(home?parts[1]:"")+ov;
 document.getElementById("mid").style.display=home?"":"none";
 if(home)document.querySelectorAll("#mid video").forEach(v=>{v.muted=true;if(v.paused)v.play().catch(()=>{})});
 if(hadQ){const q=document.getElementById(fid);if(q){q.focus();q.setSelectionRange(pos,pos)}}
 document.getElementById("foot").style.display=S.view=="c"?"none":"";
 document.getElementById("clock").textContent="Demo clock: minute "+S.clock;
 window.scrollTo(0,y)}
render();
</script>
</body>
</html>
